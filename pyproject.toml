[project]
name = "neuron-steer"
version = "0.1.0"
description = "Local multi-neuron MLP steering lab for Qwen3-8B (ask it 'Who are you?')"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.51",
    "accelerate>=0.30",
]

[project.scripts]
neuron-steer = "neuron_steer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuron_steer"]
